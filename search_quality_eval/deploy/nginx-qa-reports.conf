# /etc/nginx/conf.d/qa-reports.conf
# 정적 대시보드 호스팅 (현 단계: API 없음 / 도메인·TLS·API는 추후 확장).
#
# 현재 상태 정리:
#   - /etc/nginx/nginx.conf 의 기본 server(80, root /usr/share/nginx/html)가 살아있음
#   - 기존엔 대시보드가 ':8080/qa-reports/'에 붙어 있었음
# 이 파일은 대시보드를 포트 80 루트로 올린다. 적용 시:
#   1) nginx.conf 의 기본 server 블록(root /usr/share/nginx/html)을 주석/삭제
#      (같은 80 default_server 가 둘이면 충돌)
#   2) 기존 8080 'location /qa-reports/' server 블록도 제거(또는 유지하려면 default_server 줄 빼기)
#   3) sudo cp deploy/nginx-qa-reports.conf /etc/nginx/conf.d/qa-reports.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
# 전제 레이아웃 (이미 맞춰둠):
#   /var/www/qa-reports/index.html, app.js, style.css   ← 정적 파일
#   /var/www/qa-reports/data/index.json                 ← generate_report.py가 EC2에서 자동 기록

server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;                 # 도메인 발급되면 교체 (예: search-eval.internal.plateer.com)

    root  /var/www/qa-reports;
    index index.html;

    # 정적 대시보드 (루트 서빙)
    location / {
        try_files $uri $uri/ =404;
    }

    # 회차 JSON: 캐시 끔 (app.js가 ?t= 로 무력화하지만 안전망)
    location /data/ {
        add_header Cache-Control "no-store";
    }

    # ── 쿼리 테스트 화면용 API 프록시 (uvicorn 127.0.0.1:8000) ──
    # 프런트(app.js)는 API_BASE='/api' 로 호출한다.
    # proxy_pass 끝의 '/' 가 '/api' 접두어를 떼어내므로
    #   /api/profiles        → uvicorn /profiles
    #   /api/evaluate/query  → uvicorn /evaluate/query
    # ⚠️ 현재 라이브 nginx는 listen 8080(이 파일 예시는 80) 이므로,
    #    이 location 블록을 '실제 동작 중인 server 블록'(8080) 안에 넣을 것.
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # chat 호출 + Gemini 평가 10~30초 + Phoenix 폴링까지 → 타임아웃 넉넉히
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # (TLS는 도메인 발급 후 certbot 또는 ALB에서 443 추가)
}

# ── 서브패스(/qa-reports/)를 유지하고 싶을 때의 대안 ──
# 위 server 대신 기본 server 안에 아래 location 을 두면 http://<host>/qa-reports/ 로 서빙됨:
#   location /qa-reports/ {
#       alias /var/www/qa-reports/;   # alias 사용 시 끝 슬래시 주의
#       index index.html;
#       try_files $uri $uri/ =404;
#   }
# 단, 이 경우 app.js의 data/ 상대경로는 /qa-reports/data/ 로 맞아야 함(현 레이아웃이면 OK).
