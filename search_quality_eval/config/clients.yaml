##################################
## 신규 ADK2-front API (표준 SSE + IAP 인증) — 예시
##################################
# 사용법: build_config(lang="mizuno_adk-ja", ...) 처럼 아래 키를 프로파일명으로 호출.
#  - api_type: adk_front  → runners.build_client() 가 AdkFrontClient 를 생성
#  - 라우팅은 헤더가 아니라 body 의 tab/lang/mode/search_backend 로 전달
#  - 인증(IAP): 아래 둘 중 하나
#      (A) iap_audience + iap_credentials_file : 서비스계정으로 OIDC ID 토큰 자동발급(권장, 자동화용)
#          ※ 해당 서비스계정이 IAP + 앱(Genser Discovery) 화이트리스트에 등록돼야 함
#      (B) iap_token : gcloud 등으로 발급한 Bearer 토큰을 직접 주입(수동 테스트용, 단기)

##################################
# ===== QA genserd (Cloud Run IAM 인증) =====
##################################
# 신규 환경: qa-gelatto-genserd-chat (프로파일: yamato_qa-ja / mizuno_qa-ja / shoplist_qa-ja)
#  - body/SSE 포맷은 ADK2-front 와 동일 (tab/lang/mode/search_backend, 표준 SSE)
#  - 인증만 다름: IAP(audience) 대신 Cloud Run IAM (Bearer OIDC ID 토큰)
#  - api_type: gcloud_run → runners.build_client() 가 GcloudRunClient 생성
#  토큰 발급 우선순위 (위가 높음):
#    1) iap_token / 환경변수 IAP_TOKEN·ID_TOKEN  ← 직접 주입(ID토큰 ~1h 만료, 단기용)
#    2) iap_credentials_file(서비스계정 JSON)     ← gcloud 불필요. EC2 자동화 권장(기본).
#         · Cloud Run aud=서비스 URL 은 코드가 api_base_url 로 자동 설정
#         · ⚠️ 해당 SA 가 'Genser Discovery' 화이트리스트에 등록돼 있어야 통과(아니면 403)
#    3) gcloud auth print-identity-token          ← 로컬에 gcloud 가 있을 때만
#  ※ EC2 엔 gcloud 가 없으므로 (1) 또는 (2) 필수. 아래 프로파일은 (2) 를 기본 사용.
