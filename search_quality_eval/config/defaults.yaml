# Google Sheets
credentials_file: credentials.json

# API 엔드포인트 경로
chat_endpoint: /api/chat
product_history_endpoint: /api/product/histories
product_size: 100

# 신규 ADK2-front API 기본값 (clients.yaml 에서 api_type: adk_front 인 프로파일에만 적용)
# 라우팅 정보가 헤더 → 요청 body 로 이동: tab/lang/mode/search_backend
mode: agent
search_backend: atlas

# 세션 ID 생성
session_id_readable: true

# 타임아웃 (초)
chat_timeout: 240
product_timeout: 100

# Rate Limit 재시도
max_retries: 5  # 3->5
retry_delay: 60

# 병렬 처리
max_workers: 5  # 10->5
sheet_write_delay: 0.3

# 멀티턴 변수
delay_between_turns: 2.0  # 1.0->2.0
delay_between_scenarios: 3.5  # 1.5->3.5
continue_on_turn_failure: true

# 리포트 출력 경로
report_data_dir_ec2:   "/var/www/qa-reports/dashboard/data"
report_data_dir_local: "dashboard/data"

# 평가 프롬프트 md (v2.1 코드분담형: 수치는 코드(core/scoring.py)가 계산)
default_prompt_file: 프롬프트_v2.1_GELATTO_Common_KRJP_LLM판단전용.md
aggregate_prompt_file: prompt_aggregate_v1.md
